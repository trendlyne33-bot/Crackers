function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)}

tus" id="saveStatus"></div>`; buildEditors();

function readFile(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function dataUrlToBase64(s){return s.split(',')[1]||''}
async function gh(path,method,body,token){const url='https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(GH.branch);const opts={method,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined};const r=await fetch(url,opts);const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={message:t}}if(!r.ok)throw new Error(j.message||('GitHub error '+r.status));return j}
async function putFile(path,b64,token,message){let sha=null;try{const cur=await gh(path,'GET',null,token);sha=cur.sha}catch(e){if(!/Not Found/i.test(e.message))throw e}const body={message,content:b64,branch:GH.branch};if(sha)body.sha=sha;return gh(path,'PUT',body,token)}

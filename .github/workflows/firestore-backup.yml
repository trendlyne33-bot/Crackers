name: Daily Firestore Backup

on:
  schedule:
    # 02:30 UTC = 08:00 IST, daily
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Firestore data and write backup file
        env:
          FIREBASE_API_KEY: AIzaSyB8RapRUzImlwqVMkG_tCW2GmDCs6LBxvQ
          FIREBASE_PROJECT_ID: crackle-cart-a0ee1
        run: node scripts/firestore-backup.mjs

      - name: Commit and push backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes to commit (backup identical to yesterday)."
          else
            git commit -m "Daily Firestore backup ($(date -u +%F))"
            git push
          fi

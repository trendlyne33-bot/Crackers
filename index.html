  .photo-lightbox-caption{margin-top:10px;font-weight:700;font-size:.9rem;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
</style>

<script id="app-script">
(function(){
  "use strict";

  var STORAGE_KEY = "crackersShopData";
  var cart = {}; // key: "ci_ii" -> qty
  var adminMode = false;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function slug(s,i){ return "cat-" + i + "-" + String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
  function money(n){
    n = Number(n)||0;
    return "₹" + n.toLocaleString("en-IN");
  }
  function pctOff(mrp, price){
    mrp = Number(mrp)||0; price = Number(price)||0;
    if(mrp<=0 || price>=mrp) return 0;
    return Math.round((1 - price/mrp)*100);
  }
  function waLink(data, text){
    var msg = text || ("Hi " + data.shopName + ", I would like to enquire about your crackers price list.");
    return "https://wa.me/" + (data.whatsapp||"").replace(/[^0-9]/g,"") + "?text=" + encodeURIComponent(msg);
  }
  function telLink(data){
    return "tel:" + (data.phone||"").replace(/[^0-9+\-()]/g,"");
  }
  var PHONE_PATTERN = /^(\+91-\d{10}|0\d{2,4}-\d{6,8})$/;
  function isValidIndianPhone(v){
    return PHONE_PATTERN.test(String(v||"").trim());
  }
  var PHONE_HINT = "Please enter a valid contact number — mobile as +91-9841632734, or landline as 044-26147874.";

  function loadStoredData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* localStorage unavailable — fall back to defaults */ }
    return null;
  }
  function persistData(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
    catch(e){ return false; }
  }

  /* ================= public page render ================= */

  function renderQuickNav(data){
    return data.categories.map(function(c,i){
      return '<a class="chip" href="#'+slug(c.name,i)+'">'+esc(c.name)+'</a>';
    }).join("");
  }

  function renderCategory(c,i){
    var items = (c.items||[]).map(function(it,ii){
      var off = pctOff(it.mrp, it.price);
      return '' +
        '<div class="item-card" data-cat="'+i+'" data-item="'+ii+'">' +
          '<div class="item-top">' +
            '<label class="item-photo-wrap">' +
              '<input type="file" accept="image/*" class="item-photo-input" hidden data-cat="'+i+'" data-item="'+ii+'">' +
              (it.image ?
                '<img class="item-photo" src="'+it.image+'" alt="'+esc(it.name)+'">' :
                '<div class="item-photo item-photo-empty" aria-hidden="true">🎇</div>') +
              '<span class="item-photo-edit-badge" aria-hidden="true">✎</span>' +
            '</label>' +
            '<div class="item-info"><div class="item-name">'+esc(it.name)+'</div><div class="item-unit">'+esc(it.unit||"")+'</div></div>' +
            '<div class="item-price">' +
              (off>0 ? '<div class="price-mrp tabular">'+money(it.mrp)+'</div>' : '') +
              '<div class="price-net tabular">'+money(it.price)+'</div>' +
              (off>0 ? '<span class="price-off">'+off+'% OFF</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="qty-row">' +
            '<button type="button" class="qty-btn qty-minus" aria-label="Decrease quantity">−</button>' +
            '<input type="number" min="0" inputmode="numeric" class="qty-input" value="0" aria-label="Quantity for '+esc(it.name)+'">' +
            '<button type="button" class="qty-btn qty-plus" aria-label="Increase quantity">+</button>' +
            '<span class="line-total tabular" hidden></span>' +
          '</div>' +
        '</div>';
    }).join("");
    return '' +
      '<section class="cat-section" id="'+slug(c.name,i)+'">' +
        '<div class="cat-head"><h2>'+esc(c.name)+'</h2><span class="cat-count">'+(c.items||[]).length+' items</span></div>' +
        '<div class="item-grid">'+items+'</div>' +
      '</section>';
  }

  function render(data){
    var root = document.getElementById("root");
    var html = '' +
    '<div class="topbar"><div class="wrap topbar-inner">' +
      '<div class="brand">' +
        '<span class="brand-name">'+esc(data.shopName)+'</span>' +
        '<span class="brand-tag">'+esc(data.tagline)+'</span>' +
      '</div>' +
      '<div class="top-actions">' +
        '<a class="call-chip" href="'+telLink(data)+'" aria-label="Call the shop">☎️ Call</a>' +
      '</div>' +
    '</div></div>' +

    '<div class="hero">' +
      '<canvas class="hero-canvas" id="fxCanvas" aria-hidden="true"></canvas>' +
      '<div class="hero-fade" aria-hidden="true"></div>' +
      '<div class="wrap hero-content">' +
        '<div class="eyebrow">'+esc(data.offerText||"Special Offer")+'</div>' +
        '<h1>Diwali crackers, straight from the Sivakasi factories.</h1>' +
        '<p class="hero-offer-sub">'+esc(data.offerSubtext||"")+'</p>' +
        '<div class="hero-ctas">' +
          '<a class="cta cta-whatsapp" href="'+waLink(data)+'" target="_blank" rel="noopener">Ask on WhatsApp</a>' +
          '<a class="cta cta-primary" href="'+telLink(data)+'">Call to Order</a>' +
          '<a class="cta cta-ghost" href="#pricelist">Choose items below</a>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="wrap">' +
      '<nav class="quicknav" aria-label="Jump to category">'+renderQuickNav(data)+'</nav>' +
      '<div id="pricelist">' + data.categories.map(renderCategory).join("") + '</div>' +
      '<div class="legal">' +
        '<div class="legal-title">'+esc(data.license||"")+'</div>' +
        '<p>'+esc(data.legalNote||"")+'</p>' +
      '</div>' +
    '</div>' +

    '<footer><div class="wrap">' +
      '<div class="foot-grid">' +
        '<div>' +
          '<div class="foot-title">Visit or write to us</div>' +
          '<div class="foot-line">'+esc(data.address)+'</div>' +
          '<div class="foot-line">'+esc(data.hours)+'</div>' +
        '</div>' +
        '<div>' +
          '<div class="foot-title">Contact</div>' +
          '<div class="foot-line"><a href="'+telLink(data)+'">'+esc(data.phone)+'</a></div>' +
          '<div class="foot-line"><a href="'+waLink(data)+'" target="_blank" rel="noopener">WhatsApp us</a></div>' +
        '</div>' +
      '</div>' +

  /* ---------- ambient fireworks canvas ---------- */
  function startFireworks(canvas){
    if(!canvas) return;
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio||1, 2);
    var w,h, particles = [];
    var colors = ["#f5a623","#e0435a","#3fd6c2","#ffd54a","#ff8fab"];

    function resize(){
      var rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = w*dpr; canvas.height = h*dpr;
      canvas.style.width = w+"px"; canvas.style.height = h+"px";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function burst(){
      var cx = w*(0.15+Math.random()*0.7), cy = h*(0.1+Math.random()*0.55);
      var color = colors[Math.floor(Math.random()*colors.length)];
      var n = 26;
      for(var i=0;i<n;i++){
        var a = (Math.PI*2*i)/n + Math.random()*0.2;
        var speed = 0.6+Math.random()*1.6;
        particles.push({x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1,color:color});
      }
    }
    var lastBurst = 0;
    function tick(t){
      if(!w) resize();
      ctx.clearRect(0,0,w,h);
      if(t-lastBurst > 1500){ burst(); lastBurst = t; }
      particles.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.012; p.life-=0.012;
        if(p.life>0){
          ctx.globalAlpha = Math.max(p.life,0);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x,p.y,1.8,0,Math.PI*2); ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
      particles = particles.filter(function(p){ return p.life>0; });
      if(!reduced) requestAnimationFrame(tick);
    }
    window.addEventListener("resize", resize);
    resize();
    if(reduced){
      burst();
      ctx.clearRect(0,0,w,h);
      particles.forEach(function(p){
        ctx.fillStyle = p.color; ctx.globalAlpha=0.6;
        ctx.beginPath(); ctx.arc(p.x,p.y,1.8,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1;
    } else {
      requestAnimationFrame(tick);
    }
  }

  function wirePriceListEvents(){
    var list = document.getElementById("pricelist");
    list.addEventListener("click", function(e){
      var photoWrap = e.target.closest(".item-photo-wrap");
      if(photoWrap){
        if(adminMode) return; // let the label open the file picker
        e.preventDefault();
        var card0 = photoWrap.closest(".item-card");
        var ci0 = card0.getAttribute("data-cat"), ii0 = card0.getAttribute("data-item");
        var item0 = window.__DATA__.categories[ci0] && window.__DATA__.categories[ci0].items[ii0];
        if(item0 && item0.image){ openPhotoLightbox(item0.image, item0.name); }
        return;
      }
      var minus = e.target.closest(".qty-minus");
      var plus = e.target.closest(".qty-plus");
      if(!minus && !plus) return;
      var card = e.target.closest(".item-card");
      var input = card.querySelector(".qty-input");
      var val = parseInt(input.value,10)||0;
      val = plus ? val+1 : Math.max(0, val-1);
      input.value = val;
      applyQty(card, val);
    });
    list.addEventListener("change", function(e){
      if(e.target.classList.contains("item-photo-input")){
        if(!adminMode) return;
        var file = e.target.files[0];
        if(!file) return;
        var ci = e.target.getAttribute("data-cat"), ii = e.target.getAttribute("data-item");
        var reader = new FileReader();
        reader.onload = function(ev){
          window.__DATA__.categories[ci].items[ii].image = ev.target.result;
          var wrap = e.target.closest(".item-photo-wrap");
          var existingImg = wrap.querySelector("img.item-photo");
          var placeholder = wrap.querySelector(".item-photo-empty");
          if(existingImg){
            existingImg.src = ev.target.result;
          } else if(placeholder){
            var img = document.createElement("img");
            img.className = "item-photo";
            img.alt = "";
            img.src = ev.target.result;
            wrap.replaceChild(img, placeholder);
          }
        };
        reader.readAsDataURL(file);
        return;
      }
      if(!e.target.classList.contains("qty-input")) return;
      var card = e.target.closest(".item-card");
      var val = Math.max(0, parseInt(e.target.value,10)||0);
      e.target.value = val;
      applyQty(card, val);
    });
  }

  function applyQty(card, val){
    var ci = card.getAttribute("data-cat"), ii = card.getAttribute("data-item");
    var key = ci+"_"+ii;
    if(val>0) cart[key]=val; else delete cart[key];
    var item = window.__DATA__.categories[ci].items[ii];
    var lineEl = card.querySelector(".line-total");
    if(val>0){ lineEl.hidden=false; lineEl.textContent = money(val*item.price); }
    else { lineEl.hidden=true; }
    updateCartBar();
  }

  function getCartItems(){
    var items = [];
    Object.keys(cart).forEach(function(k){
      var parts = k.split("_"); var ci=parts[0], ii=parts[1];
      var cat = window.__DATA__.categories[ci];
      if(!cat) return;
      var it = cat.items[ii];
      if(!it) return;
      var qty = cart[k];
      items.push({name:it.name, unit:it.unit, price:it.price, qty:qty, lineTotal:qty*it.price});
    });
    return items;
  }
  function getCartCount(){
    return Object.keys(cart).reduce(function(s,k){ return s+cart[k]; },0);
  }
  function getCartTotal(){
    return getCartItems().reduce(function(s,it){ return s+it.lineTotal; },0);
  }

  function updateCartBar(){
    var count = getCartCount();
    var bar = document.getElementById("cartBar");
    if(!bar) return;
    if(count>0){
      bar.hidden = false;
      document.getElementById("cartCount").textContent = count;
      document.getElementById("cartTotal").textContent = money(getCartTotal());
      document.body.classList.add("has-cartbar");
    } else {
      bar.hidden = true;
      document.body.classList.remove("has-cartbar");
    }
  }

  function resetCart(){
    cart = {};
    document.querySelectorAll("#pricelist .qty-input").forEach(function(inp){ inp.value = 0; });
    document.querySelectorAll("#pricelist .line-total").forEach(function(el){ el.hidden = true; });
    updateCartBar();
  }

  function buildOrderSummaryText(order){
    var lines = order.items.map(function(it){
      return it.name + " (" + (it.unit||"") + ") x" + it.qty + " = " + money(it.lineTotal);
    }).join("\n");
    return "Order from: " + order.name + "\nPhone: " + order.phone + "\nDelivery address: " + order.address +
      "\n\nItems:\n" + lines + "\n\nTotal: " + money(order.total) +
      "\nUPI reference: " + (order.upiRef || "(not provided)");
  }

  function ensureEmailJsLoaded(){
    return new Promise(function(resolve,reject){
      if(window.emailjs){ resolve(); return; }
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error("failed to load email service")); };
      document.head.appendChild(s);
    });
  }

  function sendOrder(order){
    var data = window.__DATA__;
    var cfg = data.email || {};
    if(cfg.serviceId && cfg.templateId && cfg.publicKey){
      return ensureEmailJsLoaded().then(function(){
        window.emailjs.init(cfg.publicKey);
        return window.emailjs.send(cfg.serviceId, cfg.templateId, {
          to_email: data.ownerEmail || "",
          shop_name: data.shopName || "",
          customer_name: order.name,
          customer_phone: order.phone,
          customer_address: order.address,
          order_summary: buildOrderSummaryText(order),
          order_total: order.total,
          upi_ref: order.upiRef || ""
        });
      }).then(function(){
        return {ok:true, method:"email"};
      }).catch(function(){
        openMailtoFallback(order, data);
        return {ok:true, method:"mailto"};
      });
    }
    openMailtoFallback(order, data);
    return Promise.resolve({ok:true, method:"mailto"});
  }

  function openMailtoFallback(order, data){
    var subject = encodeURIComponent("New order from " + order.name);
    var body = encodeURIComponent(buildOrderSummaryText(order));
    window.open("mailto:" + (data.ownerEmail||"") + "?subject=" + subject + "&body=" + body, "_blank");
  }

  function submitOrder(via){
    var name = document.getElementById("ord-name").value.trim();
    var phone = document.getElementById("ord-phone").value.trim();
    var address = document.getElementById("ord-address").value.trim();
    var upiRefEl = document.getElementById("ord-upiref");
    var upiRef = upiRefEl ? upiRefEl.value.trim() : "";
    if(!name || !phone || !address){
      alert("Please fill your name, contact number and delivery address.");
      return;
    }
    if(!isValidIndianPhone(phone)){
      alert(PHONE_HINT);
      return;
    }
    var items = getCartItems();
    if(items.length===0){ alert("Your cart is empty."); return; }
    var total = items.reduce(function(s,it){ return s+it.lineTotal; },0);
    var order = {name:name, phone:phone, address:address, upiRef:upiRef, items:items, total:total};

    if(via === "whatsapp"){
      window.open(waLink(window.__DATA__, buildOrderSummaryText(order)), "_blank");
      showOrderConfirmation(order);
      resetCart();
      return;
    }

    var btn = document.getElementById("submitOrderBtn");
    if(btn){ btn.disabled = true; btn.textContent = "Sending…"; }
    sendOrder(order).then(function(){
      showOrderConfirmation(order);
      resetCart();
    }).finally(function(){
      if(btn){ btn.disabled = false; btn.textContent = "Submit order"; }
    });
  }

  function downloadHtml(data, filename){

      document.body.appendChild(a);

      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      return true;
    }catch(e){ return false; }

        draft.categories[ci].items.push({name:"New Item", unit:"Piece", mrp:0, price:0, image:""});
        renderCatEditors();
      } else if(removeItem){
        var editRow = e.target.closest(".item-edit");
        readFormBasics(); readCategoriesFromDOM();
        var ci2 = Number(editRow.getAttribute("data-cat")), ii2 = Number(editRow.getAttribute("data-item"));
        draft.categories[ci2].items.splice(ii2,1);
        renderCatEditors();
      } else if(removeCat){
        var ed = e.target.closest(".cat-editor");
        readFormBasics(); readCategoriesFromDOM();
        var ci3 = Number(ed.getAttribute("data-cat"));
        draft.categories.splice(ci3,1);
        renderCatEditors();
      } else if(removePhoto){
        var editRow2 = e.target.closest(".item-edit");
        readFormBasics(); readCategoriesFromDOM();
        var ci4 = Number(editRow2.getAttribute("data-cat")), ii4 = Number(editRow2.getAttribute("data-item"));
        draft.categories[ci4].items[ii4].image = "";
        renderCatEditors();
      }
    });
    document.getElementById("catEditorHost").addEventListener("change", function(e){
      if(!e.target.classList.contains("f-item-photo")) return;
      var file = e.target.files[0];
      if(!file) return;
      var editRow3 = e.target.closest(".item-edit");
      var ci5 = Number(editRow3.getAttribute("data-cat")), ii5 = Number(editRow3.getAttribute("data-item"));
      readFormBasics(); readCategoriesFromDOM();
      var reader = new FileReader();
      reader.onload = function(ev){
        draft.categories[ci5].items[ii5].image = ev.target.result;
        renderCatEditors();
      };
      reader.readAsDataURL(file);
    });
    document.getElementById("f-upiQr").addEventListener("change", function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        draft.upi = draft.upi || {};
        draft.upi.qrImage = ev.target.result;
        updateUpiPreview();
      };
      reader.readAsDataURL(file);
    });
    document.getElementById("removeUpiQrBtn").addEventListener("click", function(){
      draft.upi = draft.upi || {};
      draft.upi.qrImage = "";
      document.getElementById("f-upiQr").value = "";
      updateUpiPreview();
    });
  }

  /* ---------- photo lightbox ---------- */
  function openPhotoLightbox(src, name){
    document.getElementById("photoLightboxImg").src = src;
    document.getElementById("photoLightboxImg").alt = name || "";
    document.getElementById("photoLightboxCaption").textContent = name || "";
    document.getElementById("photoLightboxBackdrop").hidden = false;
    document.getElementById("photoLightbox").hidden = false;
  }
  function closePhotoLightbox(){
    document.getElementById("photoLightboxBackdrop").hidden = true;
    document.getElementById("photoLightbox").hidden = true;
    document.getElementById("photoLightboxImg").src = "";
  }

  /* ---------- admin login ---------- */
  function openAdminModal(){
    document.getElementById("adminPasswordInput").value = "";
    document.getElementById("adminBackdrop").hidden = false;
    document.getElementById("adminModal").hidden = false;
    document.getElementById("adminPasswordInput").focus();
  }
  function closeAdminModal(){
    document.getElementById("adminBackdrop").hidden = true;
    document.getElementById("adminModal").hidden = true;
  }
  function tryAdminUnlock(){
    var pw = document.getElementById("adminPasswordInput").value;
    if(pw === (window.__DATA__.adminPassword || "admin123")){
      closeAdminModal();
      enterAdminMode();
      openSettingsDrawer();
    } else {
      alert("Incorrect password.");
    }
  }
  function enterAdminMode(){
    adminMode = true;
    document.body.classList.add("admin-active");
  }

  /* ================= build overlay markup (once) ================= */
  function buildOverlays(){
    var host = document.createElement("div");
    host.innerHTML = '' +
      /* checkout */
      '<div class="backdrop" id="checkoutBackdrop" hidden></div>' +
      '<aside class="drawer" id="checkoutDrawer" hidden role="dialog" aria-label="Complete your order">' +
        '<div class="drawer-head"><h2>Complete your order</h2><button class="icon-btn" id="closeCheckout" aria-label="Close">✕</button></div>' +
        '<div class="drawer-body" id="checkoutBody"></div>' +
        '<div class="drawer-foot" id="checkoutFoot">' +
          '<p class="save-hint">Submitting sends your order to the shop by email. You can also send it via WhatsApp instead.</p>' +
          '<div class="drawer-foot-row">' +
            '<button class="btn-cancel" id="cancelCheckoutBtn" type="button">Cancel</button>' +
            '<button class="btn-download" id="whatsappOrderBtn" type="button">Send via WhatsApp</button>' +
            '<button class="btn-save" id="submitOrderBtn" type="button">Submit order</button>' +
          '</div>' +
        '</div>' +
      '</aside>' +
      /* settings */
      '<div class="backdrop" id="settingsBackdrop" hidden></div>' +
      '<aside class="drawer" id="settingsDrawer" hidden role="dialog" aria-label="Shop settings">' +
        '<div class="drawer-head"><h2>Shop settings</h2><button class="icon-btn" id="closeSettings" aria-label="Close settings">✕</button></div>' +
        '<div class="drawer-body">' +
          '<div class="section-label" style="margin-top:0;">Shop details</div>' +
          '<div class="field"><label for="f-shopName">Shop name</label><input id="f-shopName" type="text"></div>' +
          '<div class="field"><label for="f-tagline">Tagline</label><input id="f-tagline" type="text"></div>' +
          '<div class="field"><label for="f-phone">Phone (for Call button)</label><input id="f-phone" type="text" placeholder="+91-9841632734 or 044-26147874"></div>' +
          '<div class="field"><label for="f-whatsapp">WhatsApp number (digits, country code)</label><input id="f-whatsapp" type="text" placeholder="919876543210"></div>' +
          '<div class="field"><label for="f-address">Address</label><textarea id="f-address"></textarea></div>' +
          '<div class="field"><label for="f-hours">Hours</label><input id="f-hours" type="text"></div>' +
          '<div class="field"><label for="f-license">License / compliance line</label><input id="f-license" type="text"></div>' +

          '<div class="section-label">Offer banner</div>' +
          '<div class="field"><label for="f-offerText">Offer badge text</label><input id="f-offerText" type="text"></div>' +
          '<div class="field"><label for="f-offerSubtext">Offer description</label><textarea id="f-offerSubtext"></textarea></div>' +
          '<div class="field"><label for="f-legalNote">Safety / legal note</label><textarea id="f-legalNote"></textarea></div>' +

          '<div class="section-label">Orders &amp; payment</div>' +
          '<div class="field"><label for="f-ownerEmail">Order email address</label><input id="f-ownerEmail" type="email" placeholder="you@example.com"></div>' +
          '<div class="field"><label for="f-upiId">UPI ID</label><input id="f-upiId" type="text" placeholder="shopname@okhdfcbank"></div>' +
          '<div class="field"><label for="f-upiPayee">UPI payee name (shown to customers)</label><input id="f-upiPayee" type="text"></div>' +
          '<div class="field">' +
            '<label for="f-upiQr">UPI QR code image</label>' +
            '<input id="f-upiQr" type="file" accept="image/*">' +
            '<img id="upiQrPreview" class="upi-qr-preview" hidden alt="UPI QR preview" style="margin-top:8px;">' +
            '<button type="button" class="mini-btn" id="removeUpiQrBtn" style="margin-top:6px;">Remove QR image</button>' +
          '</div>' +
          '<p class="save-hint">Optional — for orders to arrive automatically in your inbox instead of opening an email app, create a free account at emailjs.com, add an email service and a template, then paste the three IDs it gives you below.</p>' +
          '<div class="field"><label for="f-emailService">EmailJS Service ID</label><input id="f-emailService" type="text"></div>' +
          '<div class="field"><label for="f-emailTemplate">EmailJS Template ID</label><input id="f-emailTemplate" type="text"></div>' +
          '<div class="field"><label for="f-emailPublicKey">EmailJS Public Key</label><input id="f-emailPublicKey" type="text"></div>' +

          '<div class="section-label">Security</div>' +
          '<div class="field"><label for="f-adminPassword">Admin password</label><input id="f-adminPassword" type="text"></div>' +
          '<p class="save-hint">This hides settings from regular visitors, but this page has no real server — anyone who inspects the page’s code could still find this password. Don’t reuse an important password here.</p>' +

          '<div class="section-label">Categories &amp; price list</div>' +
          '<div id="catEditorHost"></div>' +
          '<button type="button" class="add-btn" id="addCategoryBtn">+ Add category</button>' +
        '</div>' +
        '<div class="drawer-foot">' +
          '<p class="save-hint">This page is a static file, so "Save" updates what you see here and downloads an updated index.html — upload that file to your GitHub repo to make the change live for visitors.</p>' +
          '<div class="drawer-foot-row">' +
            '<button class="btn-cancel" id="cancelSettingsBtn" type="button">Cancel</button>' +
            '<button class="btn-download" id="downloadBtn" type="button">Download only</button>' +
            '<button class="btn-save" id="saveBtn" type="button">Save &amp; download</button>' +
          '</div>' +
        '</div>' +
      '</aside>' +
      /* admin login */
      '<div class="backdrop" id="adminBackdrop" hidden></div>' +
      '<div class="modal" id="adminModal" hidden role="dialog" aria-label="Admin login">' +
        '<h2>Shop admin</h2>' +
        '<p class="save-hint">Enter the admin password to edit shop details, products and prices.</p>' +
        '<div class="field" style="margin-top:10px;margin-bottom:0;"><label for="adminPasswordInput">Password</label><input id="adminPasswordInput" type="password"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-cancel" id="adminCancelBtn" type="button">Cancel</button>' +
          '<button class="btn-save" id="adminUnlockBtn" type="button">Unlock</button>' +
        '</div>' +
      '</div>' +
      /* photo lightbox */
      '<div class="backdrop" id="photoLightboxBackdrop" hidden></div>' +
      '<div class="modal photo-lightbox" id="photoLightbox" hidden role="dialog" aria-label="Product photo">' +
        '<button type="button" class="icon-btn photo-lightbox-close" id="closePhotoLightbox" aria-label="Close">✕</button>' +
        '<img id="photoLightboxImg" src="" alt="">' +
        '<div class="photo-lightbox-caption" id="photoLightboxCaption"></div>' +
      '</div>';
    while(host.firstChild) document.body.appendChild(host.firstChild);
  }

  function wireOverlayEvents(){
    document.getElementById("adminLoginBtn").addEventListener("click", function(){
      if(adminMode){ openSettingsDrawer(); } else { openAdminModal(); }
    });
    document.getElementById("adminCancelBtn").addEventListener("click", closeAdminModal);
    document.getElementById("adminBackdrop").addEventListener("click", closeAdminModal);
    document.getElementById("adminUnlockBtn").addEventListener("click", tryAdminUnlock);
    document.getElementById("adminPasswordInput").addEventListener("keydown", function(e){
      if(e.key === "Enter") tryAdminUnlock();
    });
    document.getElementById("closePhotoLightbox").addEventListener("click", closePhotoLightbox);
    document.getElementById("photoLightboxBackdrop").addEventListener("click", closePhotoLightbox);

    document.getElementById("closeCheckout").addEventListener("click", closeCheckout);
    document.getElementById("cancelCheckoutBtn").addEventListener("click", closeCheckout);
    document.getElementById("checkoutBackdrop").addEventListener("click", closeCheckout);
    document.getElementById("submitOrderBtn").addEventListener("click", function(){ submitOrder("email"); });
    document.getElementById("whatsappOrderBtn").addEventListener("click", function(){ submitOrder("whatsapp"); });

    wireSettingsEvents();

    document.addEventListener("keydown", function(e){
      if(e.key !== "Escape") return;
      if(!document.getElementById("settingsDrawer").hidden) closeSettingsDrawer();
      else if(!document.getElementById("checkoutDrawer").hidden) closeCheckout();
      else if(!document.getElementById("adminModal").hidden) closeAdminModal();
      else if(!document.getElementById("photoLightbox").hidden) closePhotoLightbox();
    });
  }

  /* Re-wire checkoutBtn/cartBar events after each full render(), since #root is rebuilt */
  var _origRender = render;
  render = function(data){
    _origRender(data);
    var btn = document.getElementById("checkoutBtn");
    if(btn) btn.addEventListener("click", openCheckout);
  };

  function boot(){
    var stored = loadStoredData();
    if(stored) window.__DATA__ = stored;
    render(window.__DATA__);
    buildOverlays();
    wireOverlayEvents();
  }

  boot();
})();
</script>
</body>
</html>
